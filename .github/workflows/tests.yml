name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Pin to a specific LTS runner so a future ubuntu-latest bump cannot drop a
    # Python version out from under the matrix without warning.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        # Fully deterministic and offline; MOCK_LLM keeps it free of API calls.
        env:
          CHATBOT_MODE: hardened
          MOCK_LLM: "true"
        run: python -m pytest -p no:warnings
