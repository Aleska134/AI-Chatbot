# Render Blueprint for the reference merchant chatbot.
# Deploy by connecting this repo on https://render.com (New -> Blueprint) and
# pointing it at this file. Render reads everything below automatically.
#
# Two instances of the SAME codebase run in parallel so the security platform
# can compare protected vs. intentionally weaker behavior without flipping an
# env var and restarting:
#   - reference-merchant-chatbot       -> CHATBOT_MODE=hardened
#   - reference-merchant-chatbot-weak  -> CHATBOT_MODE=weak
# Each gets its own auto-generated CHATBOT_AUTH_TOKEN. Register both as separate
# targets on the platform. The server decides the mode (CHATBOT_MODE); the URL
# is the same shape for both. Confirm a mode with GET /api/v1/metadata.
services:
  # ---- Hardened instance (strict security enforcement) ----
  - type: web
    name: reference-merchant-chatbot
    runtime: python
    plan: free
    # Render provides $PORT; uvicorn must bind to it.
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    # /health already returns service status, mode, and environment.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: CHATBOT_MODE
        value: hardened
      - key: MOCK_LLM
        value: "true"
      - key: ENVIRONMENT
        value: production
      # Require "Authorization: Bearer <token>" on /api/v1/chat.
      # Generated by Render on first deploy; copy it into the security platform
      # when you register this target. Remove this block to leave the endpoint open.
      - key: CHATBOT_AUTH_TOKEN
        generateValue: true

  # ---- Weak instance (intentionally less protected, for comparison) ----
  # Same codebase, only CHATBOT_MODE differs. This is the control target: the
  # platform should find breaches here that the hardened instance resists.
  - type: web
    name: reference-merchant-chatbot-weak
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: CHATBOT_MODE
        value: weak
      - key: MOCK_LLM
        value: "true"
      - key: ENVIRONMENT
        value: production
      # Its own separate token (do not reuse the hardened instance's token).
      - key: CHATBOT_AUTH_TOKEN
        generateValue: true
